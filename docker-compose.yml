# Project template - Software Security
# Usage:  docker compose up --build
# Delete data and start from scratch:  docker compose down -v

name: seguridad-software

services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    ports:
      - "3306:3306"
    volumes:
      - db-datos:/var/lib/mysql
      # The .sql files in this folder run ONLY when the volume is first created.
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h 127.0.0.1 -u root --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  mailpit:
    # Test mail server: captures every email the application sends.
    image: axllent/mailpit:v1.31.1
    ports:
      - "8025:8025"
    restart: unless-stopped

  mock-api:
    # Simulator of the case's external API.
    build: ./mock-api
    restart: unless-stopped

  seed:
    # Runs once: creates the administrator and the test accounts.
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "app.seed"]
    env_file: .env
    environment:
      DB_HOST: db
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DB_HOST: db
      SMTP_HOST: mailpit
    depends_on:
      db:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
      mock-api:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  worker:
    # Periodic C++ robot.
    build: ./worker
    environment:
      BACKEND_URL: http://backend:8000
      WORKER_TOKEN: ${WORKER_TOKEN}
      WORKER_INTERVAL_SECONDS: ${WORKER_INTERVAL_SECONDS:-60}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  web:
    # Serves the SPA (Vue) and proxies /api to the backend.
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db-datos:
