# AI Agent Marketplace
# Start everything with docker compose up --build
# Delete all data and start clean with docker compose down -v

name: ai-marketplace-demo

services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      # Used by database/init/99-app-user.sh to create the user of the application.
      DB_USER: ${DB_USER:?Set DB_USER in the .env file}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the .env file}
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql
      # The .sql files in this folder run only when the volume is first created.
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h 127.0.0.1 -u root --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  mailpit:
    # Test mail server that keeps every email the application sends.
    image: axllent/mailpit:v1.31.1
    ports:
      - "8025:8025"
    restart: unless-stopped

  mock-api:
    # Simulated OpenRouter AI service, so no real key is needed.
    build: ./mock-api
    restart: unless-stopped

  seed:
    # Runs once to create the admin and the test accounts.
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "app.seed"]
    # Only the variables it needs, so it never receives the password of the MySQL root user.
    environment:
      CASE: ${CASE}
      DB_HOST: db
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SEED_PASSWORD: ${SEED_PASSWORD}
      WORKER_API_KEY: ${WORKER_API_KEY}
      DISPATCHER_API_KEY: ${DISPATCHER_API_KEY:?Set DISPATCHER_API_KEY in the .env file}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    # Only the variables it needs, so it never receives the password of the MySQL root user.
    environment:
      CASE: ${CASE}
      SECRET_KEY: ${SECRET_KEY}
      DB_HOST: db
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      SMTP_HOST: mailpit
      EXTERNAL_API_BASE_URL: ${EXTERNAL_API_BASE_URL:-}
      EXTERNAL_API_KEY: ${EXTERNAL_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
      mock-api:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  worker:
    # C++ robot that approves the complete registrations through the backend on a timer.
    build: ./worker
    environment:
      BACKEND_URL: http://backend:8000
      ROBOT_TASK: approvals
      WORKER_API_KEY: ${WORKER_API_KEY:?Set WORKER_API_KEY in the .env file}
      WORKER_INTERVAL_SECONDS: ${WORKER_INTERVAL_SECONDS:-60}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  dispatcher:
    # Same C++ robot with the dispatch task. It launches the due scheduled executions through the backend every second.
    build: ./worker
    environment:
      BACKEND_URL: http://backend:8000
      ROBOT_TASK: dispatch
      # The robot reads its key from WORKER_API_KEY and here it receives the key of the dispatch account.
      WORKER_API_KEY: ${DISPATCHER_API_KEY:?Set DISPATCHER_API_KEY in the .env file}
      WORKER_INTERVAL_SECONDS: "1"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    # A launch can take up to 25 seconds, so Docker waits longer than its default of 10 before it kills the robot.
    stop_grace_period: 30s
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  web:
    # Serves the Vue interface and forwards /api to the backend.
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db-data:
